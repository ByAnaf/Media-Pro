<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Pro — Transfer Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grain"></div>

<main class="console">

  <header class="console__head">
    <span class="eyebrow">MEDIA&nbsp;PRO&nbsp;//&nbsp;TRANSFER&nbsp;CONSOLE</span>
    <span class="build-tag">v2.0</span>
  </header>

  <h1 class="title">Paste a link.<br>Pull the file.</h1>
  <p class="subtitle">Drop a URL below, choose a format, and the console handles the rest.</p>

  <!-- Drop / input zone -->
  <div class="dropzone" id="dropzone">
    <div class="dropzone__row">
      <input
        type="text"
        id="urlInput"
        placeholder="https://…"
        autocomplete="off"
        spellcheck="false"
        aria-label="Media URL"
      >
      <button id="pasteBtn" class="icon-btn" type="button" aria-label="Paste from clipboard" title="Paste">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="4" width="10" height="16" rx="1.5"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/></svg>
      </button>
      <button id="clearBtn" class="icon-btn" type="button" aria-label="Clear input" title="Clear">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <p class="dropzone__hint">or drag a link here</p>
  </div>

  <!-- Options -->
  <div class="options">
    <div class="option-group" role="group" aria-label="Format">
      <span class="option-label">Format</span>
      <div class="segmented" id="formatGroup">
        <button class="seg active" data-value="video" type="button">Video</button>
        <button class="seg" data-value="audio" type="button">Audio</button>
      </div>
    </div>
    <div class="option-group" role="group" aria-label="Quality">
      <span class="option-label">Quality</span>
      <div class="segmented" id="qualityGroup">
        <button class="seg" data-value="480">480p</button>
        <button class="seg active" data-value="1080">1080p</button>
        <button class="seg" data-value="best">Best</button>
      </div>
    </div>
  </div>

  <button class="primary-btn" id="mainBtn" type="button">
    <span class="primary-btn__label">Generate download</span>
    <span class="primary-btn__scan" aria-hidden="true"></span>
  </button>

  <!-- Status log -->
  <div class="log" id="log" aria-live="polite"></div>

  <!-- History -->
  <section class="history" id="historySection" hidden>
    <div class="history__head">
      <span class="option-label">Recent</span>
      <button id="clearHistoryBtn" class="text-btn" type="button">Clear</button>
    </div>
    <ul class="history__list" id="historyList"></ul>
  </section>

  <footer class="console__foot">
    <span>No files are stored. Everything runs in this browser session.</span>
  </footer>

</main>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Downloader</title>
    <style>
        :root {
            --accent: #a78bfa;
            --bg: #0f172a;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: white;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(167, 139, 250, 0.2);
            padding: 3rem;
            border-radius: 24px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h2 { margin: 0 0 10px; color: var(--accent); letter-spacing: 1px; }
        p { opacity: 0.6; font-size: 0.9rem; margin-bottom: 30px; }

        .input-group { position: relative; }

        input {
            width: 100%;
            padding: 16px;
            background: rgba(0,0,0,0.4);
            border: 2px solid #334155;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            margin-bottom: 20px;
            transition: 0.3s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.3);
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: #1e1b4b;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #c4b5fd;
            transform: translateY(-2px);
        }

        #status {
            margin-top: 25px;
            font-size: 0.85rem;
            min-height: 20px;
        }

        .success-link {
            display: inline-block;
            margin-top: 15px;
            color: #4ade80;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border: 1px solid #4ade80;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="glass-card">
    <h2>Media Pro By Anaf</h2>
    <p>Universal Video & Reels Downloader</p>
    
    <input type="text" id="urlInput" placeholder="Paste link here...">
    <button onclick="handleDownload()" id="mainBtn">GENERATE DOWNLOAD</button>
    
    <div id="status"></div>
</div>

<script>
async function handleDownload() {
    const url = document.getElementById('urlInput').value;
    const status = document.getElementById('status');
    const btn = document.getElementById('mainBtn');

    if(!url) return alert("Please paste a link!");

    status.innerHTML = "⚡ Initializing Secure Stream...";
    btn.disabled = true;
    btn.style.opacity = "0.5";

    try {
        // Primary API: Cobalt (High Quality)
        const response = await fetch('https://api.cobalt.tools/api/json', {
            method: 'POST',
            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url, videoQuality: '1080' })
        });

        const data = await response.json();

        if (data.url) {
            status.innerHTML = `<a href="${data.url}" class="success-link" download>READY: CLICK TO SAVE</a>`;
            // Trigger automatic download
            window.location.href = data.url;
        } else {
            throw new Error("API limit hit");
        }

    } catch (err) {
        // Fallback Strategy: Redirecting to a web-based downloader service
        status.innerHTML = "⚠️ Primary API Busy. Redirecting to backup engine...";
        setTimeout(() => {
            // This opens a reliable web-service with the URL pre-filled
            const backupUrl = `https://9xbuddy.com/process?url=${encodeURIComponent(url)}`;
            window.open(backupUrl, '_blank');
            status.innerHTML = "Check your new tab to complete download.";
        }, 1500);
    } finally {
        btn.disabled = false;
        btn.style.opacity = "1";
    }
}
</script>

</body>
</html>
